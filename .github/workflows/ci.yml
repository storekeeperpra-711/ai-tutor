name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run on the same branch when a new commit arrives (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code lib
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  lessons:
    name: Validate lessons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate_lessons.py
      - run: python -m unittest discover -s tools -p 'test_*.py'

  # Builds an installable debug APK. Runs only on main and on manual runs,
  # because Android builds use many more CI minutes than the checks above.
  apk:
    name: Build debug APK
    if: github.event_name != 'pull_request'
    needs: [check, lessons]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ai-tutor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
