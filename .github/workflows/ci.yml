name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run on the same branch when a new commit arrives (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code lib
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  lessons:
    name: Validate lessons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate_lessons.py
      - run: python -m unittest discover -s tools -p 'test_*.py'

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/firestore-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/firestore-rules/package-lock.json
      - run: npm ci
      # Runs the tests against the Firestore emulator (no real project).
      - run: npm test

  functions:
    name: AI server tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # Type-checks and runs the tests with a fake Claude (no API key, no cost).
      - run: npm test

  # Builds an installable debug APK. Runs only on main and on manual runs,
  # because Android builds use many more CI minutes than the checks above.
  apk:
    name: Build debug APK
    if: github.event_name != 'pull_request'
    needs: [check, lessons, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug --flavor dev
      - run: flutter build apk --debug --flavor prod
      - uses: actions/upload-artifact@v4
        with:
          name: ai-tutor-debug-apks
          path: |
            build/app/outputs/flutter-apk/app-dev-debug.apk
            build/app/outputs/flutter-apk/app-prod-debug.apk
          retention-days: 14

  # Small release APKs, one per phone type (Phase 10): a phone downloads
  # only its own. armeabi-v7a works on almost every Android phone;
  # arm64-v8a is smaller and faster on newer ones. A job of its own: the
  # release build needs the runner's memory to itself.
  release-apks:
    name: Build small release APKs
    if: github.event_name != 'pull_request'
    needs: [check, lessons, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The runner has about 7 GB of memory; the project's 8 GB Gradle
      # setting (fine on a laptop) gets the release build killed here.
      - name: Fit Gradle in the runner's memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          kotlin.daemon.jvmargs=-Xmx1g
          org.gradle.workers.max=2
          PROPS
      - run: >-
          flutter build apk --release --flavor dev --split-per-abi
          --target-platform android-arm,android-arm64
      - name: APK sizes
        run: |
          echo "## APK sizes" >> "$GITHUB_STEP_SUMMARY"
          ls -l build/app/outputs/flutter-apk/*.apk \
            | awk '{printf "- %s: %.1f MB\n", $9, $5/1048576}' \
            | sed 's|build/app/outputs/flutter-apk/||' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-tutor-dev-release-apks
          path: build/app/outputs/flutter-apk/app-*-dev-release.apk
          retention-days: 14
