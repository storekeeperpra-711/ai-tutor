name: Make Mithu's voice

# Records every Mithu line in Mithu's voice (Gemini, tools/voice/make_voice.py)
# and stores it where the AI server hands it to the app (Cloudflare KV).
# Gemini's free tier allows about 10 recordings a day, so this runs by itself
# once a day and carries on where it stopped; lines already made and not
# changed are skipped, so once everything is made it costs nothing.
# Can also be run by hand: Actions -> Make Mithu's voice -> Run workflow.
# Needs the GitHub secrets GEMINI_API_KEY, CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    # 09:00 UTC (14:00 in Pakistan), after Gemini's daily limit resets.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: At most this many recordings (empty for as many as allowed)
        default: ''

permissions:
  contents: read

concurrency:
  group: make-voice
  cancel-in-progress: false

jobs:
  make:
    name: Make recordings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Make recordings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIMIT: ${{ inputs.limit }}
        run: python tools/voice/make_voice.py make ${LIMIT:+--limit "$LIMIT"}
