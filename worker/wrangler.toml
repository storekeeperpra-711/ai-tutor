# The AI server for AI Tutor. Deployed by .github/workflows/deploy-worker.yml.
# Secrets (ANTHROPIC_API_KEY, FIREBASE_SERVICE_ACCOUNT) and ADMIN_EMAILS are
# copied from GitHub secrets by the deploy workflow (or set in the Cloudflare
# dashboard), never here: see docs/setup/ai-setup.md.

# Production: talks to the ai-tutor Firebase project.
name = "ai-tutor-ai"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Keep the variables set in the dashboard when deploying (all environments).
keep_vars = true

[triggers]
crons = ["*/30 * * * *", "0 13 * * SUN"]

[observability]
enabled = true

# Mithu's recorded voice (src/voice.ts), one storage for both servers.
# The deploy workflow puts in the real id (tools/voice/kv.py makes the
# storage the first time), so nobody has to copy it from Cloudflare.
[[kv_namespaces]]
binding = "VOICE"
id = "VOICE_NAMESPACE_ID"

# Development: talks to the ai-tutor-dev Firebase project.
[env.dev]
name = "ai-tutor-ai-dev"

[[env.dev.kv_namespaces]]
binding = "VOICE"
id = "VOICE_NAMESPACE_ID"

[env.dev.triggers]
crons = ["*/30 * * * *", "0 13 * * SUN"]
